# Prometheus: scrapes the consumer. Run from the repo root:
#   prometheus --config.file=observability/prometheus.yml
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - alerts.yml          # relative to this file

scrape_configs:
  - job_name: iot-consumer
    static_configs:
      - targets: ["127.0.0.1:8001"]     # keep equal to metrics_port in configs/stream.json
