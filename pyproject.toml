[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iot-sensor-anomaly-pipeline"
version = "0.1.0"
description = "Low-latency IoT sensor anomaly detection pipeline"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dynamic = ["dependencies"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
